<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gráficos FX</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button class="tb-btn sym" id="btn-symbol" title="Buscar ativo"><span id="sym-name">EURUSD</span><svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5" /></svg></button>
      <button class="tb-btn" id="btn-tf" title="Timeframe"><span id="tf-name">1D</span></button>
      <button class="tb-btn icon" id="btn-ctype" title="Tipo de gráfico"><svg viewBox="0 0 24 24"><path d="M7 4v3M7 17v3M17 4v5M17 15v5"/><rect x="5" y="7" width="4" height="10" rx="1"/><rect x="15" y="9" width="4" height="6" rx="1"/></svg></button>
      <button class="tb-btn icon" id="btn-ind" title="Indicadores"><svg viewBox="0 0 24 24"><path d="M5 19c3-1 3-12 7-12s3 9 7 9"/><path d="M3 21h18"/></svg><span class="lbl">Indicadores</span></button>
      <button class="tb-btn icon" id="btn-replay" title="Replay"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><path d="M11 9l4 3-4 3z" fill="currentColor"/></svg><span class="lbl">Replay</span></button>
      <span class="grow"></span>
      <button class="tb-btn icon" id="btn-watch" title="Lista de ativos"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="tb-btn icon" id="btn-settings" title="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
    </header>

    <div class="main">
      <aside class="tools" id="tools"></aside>
      <div class="chart-wrap">
        <div id="chart"></div>
        <div class="legend" id="legend"></div>
        <div class="banner" id="banner" hidden></div>
        <div class="draw-pop" id="draw-pop" hidden></div>
        <div class="toast" id="toast"></div>
      </div>
      <aside class="watch" id="watch" hidden></aside>
    </div>

    <div class="replay-bar" id="replay-bar" hidden></div>
  </div>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
