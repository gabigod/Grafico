<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-layout="desk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gráficos FX</title>
</head>
<body>
  <div id="app" data-tab="chart">
    <!-- barra superior (layout de PC) -->
    <header class="top only-desk" id="top"></header>

    <div class="body">
      <aside class="tools only-desk" id="tools"></aside>
      <div class="chart-wrap" id="chart-wrap">
        <div id="chart"></div>
        <div class="legend" id="legend"></div>
        <div class="favbar" id="favbar"></div>
        <div class="cd" id="cd" hidden></div>
        <div class="rp-dim" id="rp-dim" hidden></div>
        <div class="rp-line" id="rp-line" hidden><span class="rp-sc"></span><span class="rp-chip" id="rp-chip"></span></div>
        <div class="rp-trade" id="rp-trade" hidden></div>
        <div class="banner" id="banner" hidden></div>
        <div class="draw-pop" id="draw-pop" hidden></div>
        <div class="toast" id="toast"></div>
      </div>
      <aside class="watch" id="watch"></aside>
      <nav class="rbar only-desk" id="rbar"></nav>
    </div>

    <div class="replay-bar" id="replay-bar" hidden></div>
    <footer class="bot only-desk" id="bot"></footer>

    <!-- layout de celular em pé -->
    <div class="mbot only-mob" id="mbot"></div>
    <nav class="mtabs only-mob" id="mtabs"></nav>
  </div>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
  <div class="pmenu" id="pmenu" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
